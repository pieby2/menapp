# Builds the Android app from the same code as the website (see README → Mobile apps).
#
#   push to any branch          → debug APK, downloadable from the run's artifacts. Pushes to
#                                 main also refresh the "android-latest" pre-release, a stable
#                                 download link for testers.
#   pull request from a fork    → the same build, as a compile check (branches of this repo are
#                                 already built by their push).
#   tag v*  /  manual run       → signed release APK + AAB (needs the ANDROID_* secrets); tags
#                                 get a GitHub Release, and with PLAY_SERVICE_ACCOUNT_JSON the
#                                 AAB goes to Google Play (internal testing by default).
#
# Repository variable: MENDYR_API_URL — the backend the app talks to, e.g.
# https://<app>.fastapicloud.dev. Required for anything installable.
name: Android app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      play_track:
        description: "Upload the signed AAB to this Google Play track (none = don't upload)"
        type: choice
        options: [none, internal, alpha, beta, production]
        default: none

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # GitHub Releases

jobs:
  build:
    name: Build APK / AAB
    # A pull request from a branch of this repo was already built by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_URL: ${{ vars.MENDYR_API_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v4

      - run: npm ci

      - name: Resolve the backend URL
        run: |
          if [ -z "$API_URL" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "API_URL=https://api.example.invalid" >> "$GITHUB_ENV"
              echo "::notice::MENDYR_API_URL is not set — this PR build is a compile check only."
            else
              echo "::error::Set the MENDYR_API_URL repository variable (Settings → Secrets and variables → Actions → Variables) to the backend URL, e.g. https://<app>.fastapicloud.dev"
              exit 1
            fi
          elif [[ "$API_URL" != https://* ]]; then
            echo "::error::MENDYR_API_URL must be an https:// address (the app can't call plain http), got: $API_URL"
            exit 1
          fi

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF_NAME#v}"; else name="$(node -p "require('./package.json').version")"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building Mendyr $name ($GITHUB_RUN_NUMBER)"

      - name: Build the app bundle
        run: npm run build:app -- --no-sync
        env:
          NEXT_PUBLIC_API_URL: ${{ env.API_URL }}

      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -PversionCode=${{ steps.version.outputs.code }} -PversionName=${{ steps.version.outputs.name }}

      - name: Name the debug APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk "Mendyr-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-debug.apk"

      # Uploaded as the .apk itself, not zipped: download it from the run page and install it.
      - uses: actions/upload-artifact@v7
        with:
          path: Mendyr-*-debug.apk
          archive: false
          retention-days: 14

      # One fixed asset name (replaced on every build), so this link never changes:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/Mendyr-latest.apk
      - name: Name the testers' copy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp Mendyr-*-debug.apk Mendyr-latest.apk

      - name: Refresh the testers' download link
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-latest
          name: Android — latest main build
          body: Debug build of the newest commit on main, for testing. Install on Android after allowing installs from this source.
          prerelease: true
          make_latest: false
          files: Mendyr-latest.apk

      - name: Set up release signing
        if: env.RELEASE_BUILD == 'true' && env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build signed release APK + AAB
        if: env.RELEASE_BUILD == 'true' && env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease -PversionCode=${{ steps.version.outputs.code }} -PversionName=${{ steps.version.outputs.name }}

      - name: Collect release files
        if: env.RELEASE_BUILD == 'true' && env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Mendyr-${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release/Mendyr-${{ steps.version.outputs.name }}.aab"

      - uses: actions/upload-artifact@v7
        if: env.RELEASE_BUILD == 'true' && env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: mendyr-android-release
          path: release/*
          retention-days: 90

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true

      # Google only accepts API uploads once the app exists in Play Console and its first
      # release was uploaded by hand (see README → Mobile apps → Google Play).
      - name: Upload to Google Play
        if: >-
          env.ANDROID_KEYSTORE_BASE64 != '' && env.PLAY_SERVICE_ACCOUNT_JSON != '' &&
          (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.play_track != 'none'))
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mendyr.patient
          releaseFiles: release/*.aab
          track: ${{ github.event_name == 'workflow_dispatch' && inputs.play_track || 'internal' }}
          status: completed

      - name: Remove the keystore
        if: always()
        run: rm -f android/app/release.keystore
